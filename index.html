<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蘑菇戰情室</title>
    <style>
        :root {
            --glass: rgba(44, 44, 47, 0.7);
            --glass-border: rgba(232, 180, 168, 0.16);
            --accent: rgb(180, 145, 143);
            --accent-soft: rgba(180, 145, 143, 0.35);
            --text-light: #f4f1f0;
            --card-text: #1a1a1a;
            --text-dim: #9a9a9d;
            --point-color: #e8b4a2;
            --timer-idle: #6e6e72;
            --timer-active: #e8637a;
            --timer-active-glow: rgba(232, 99, 122, 0.35);
            --timer-done: #ffd54f;
            --timer-done-glow: rgba(255, 213, 79, 0.35);
        }

        body {
            margin: 0;
            padding: 10px;
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            background-color: #1c1c1e;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(183, 110, 121, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 15%, rgba(212, 175, 140, 0.07) 0%, transparent 40%),
                radial-gradient(circle at 50% 95%, rgba(183, 110, 121, 0.09) 0%, transparent 50%),
                radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(160deg, #1c1c1e 0%, #2c2c2e 55%, #18181a 100%);
            background-size: auto, auto, auto, 26px 26px, auto;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .page-title {
            color: var(--text-light);
            text-align: center;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            background: rgba(44, 44, 47, 0.75);
            padding: 12px 30px;
            border-radius: 50px;
            margin: 15px 0 20px 0;
            border: 2px solid var(--glass-border);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: fit-content;
        }

        .sync-hint {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.85rem;
            margin: -10px 0 16px 0;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
        }

        .map-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            row-gap: 8px;
            column-gap: 10px;
            width: 100%;
            max-width: 1200px;
            box-sizing: border-box;
            margin: 0 auto;
            justify-content: center;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mush-card {
            background: var(--glass);
            padding: 10px 5px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
            border-top: 4px solid var(--accent);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            text-align: center;
            word-break: break-all;
        }

        .mush-name {
            font-weight: bold;
            font-size: clamp(0.72rem, 2.6vw, 0.95rem);
            color: var(--point-color);
            display: block;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timer-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: var(--timer-idle);
        }

        .timer-display.counting {
            color: var(--point-color);
        }

        .timer-display.active {
            color: var(--timer-active);
            text-shadow: 0 0 10px var(--timer-active-glow);
        }

        .timer-display.done {
            color: var(--timer-done);
            text-shadow: 0 0 10px var(--timer-done-glow);
        }

        .input-row {
            display: flex;
            gap: 2px;
            margin-bottom: 5px;
            justify-content: center;
        }

        .input-row input {
            width: 40px;
            padding: 4px 0;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(140, 87, 101, 0.55);
            border-radius: 4px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--card-text);
            transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
        }

        .input-row input::placeholder {
            color: var(--card-text);
        }

        .input-row input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.75);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .set-btn {
            width: 90%;
            padding: 8px 0;
            background: linear-gradient(135deg, #c98a99, #8c5765);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            transition: filter 0.15s, transform 0.1s;
        }

        .set-btn:hover {
            filter: brightness(1.15);
        }

        .set-btn:active {
            transform: scale(0.97);
        }

        @media (max-width: 800px) {
            .map-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .page-title { font-size: 1.4rem; padding: 10px 20px; }
        }
    </style>
</head>
<body>
    <h1 class="page-title">蘑菇戰情室</h1>
    <p class="sync-hint">家人共用 · 即時同步</p>
    <div class="map-grid" id="mapGrid">
        <div class="column" id="col1"></div>
        <div class="column" id="col2"></div>
        <div class="column" id="col3"></div>
        <div class="column" id="col4"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
