<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蘑菇戰情室</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.88);
            --accent: #2d5a27;
        }

        body {
            margin: 0;
            padding: 10px;
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            background-image: url('assets/Pikmin2.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .page-title {
            color: white;
            text-align: center;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            background: rgba(45, 90, 39, 0.7);
            padding: 12px 30px;
            border-radius: 50px;
            margin: 15px 0 20px 0;
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: fit-content;
        }

        .sync-hint {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.85rem;
            margin: -10px 0 16px 0;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
        }

        .map-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            width: 100%;
            max-width: 1200px;
            box-sizing: border-box;
            margin: 0 auto;
            justify-content: center;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mush-card {
            background: var(--glass);
            padding: 10px 5px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            border-top: 4px solid var(--accent);
            text-align: center;
            word-break: break-all;
        }

        .mush-name {
            font-weight: bold;
            font-size: 0.95rem;
            color: #1a1a1a;
            display: block;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timer-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            color: #d32f2f;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .input-row {
            display: flex;
            gap: 2px;
            margin-bottom: 5px;
            justify-content: center;
        }

        .input-row input {
            width: 40px;
            padding: 4px 0;
            border: 1px solid #bbb;
            border-radius: 4px;
            text-align: center;
            font-size: 0.8rem;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .set-btn {
            width: 90%;
            padding: 8px 0;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .clear-btn {
            background: transparent;
            color: #666;
            font-size: 0.7rem;
            margin-top: 5px;
            border: none;
            text-decoration: underline;
            cursor: pointer;
        }

        @media (max-width: 800px) {
            .map-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .page-title { font-size: 1.4rem; padding: 10px 20px; }
        }
    </style>
</head>
<body>
    <h1 class="page-title">蘑菇戰情室</h1>
    <p class="sync-hint">家人共用 · 即時同步</p>
    <div class="map-grid" id="mapGrid">
        <div class="column" id="col1"></div>
        <div class="column" id="col2"></div>
        <div class="column" id="col3"></div>
        <div class="column" id="col4"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
